spring.application.name=brightloop-subscriptions
server.port=8080
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/brightloop;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
